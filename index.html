<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gate Ticketing</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e2e5ea;--ac:#0f766e;--ac2:#fff;--ok:#15803d;--er:#b91c1c;--wa:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--tx:#e8eaee;--mu:#9aa3af;--bd:#2d343e;--ac:#2dd4bf;--ac2:#06201d;--ok:#4ade80;--er:#f87171;--wa:#fbbf24}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--tx:#e8eaee;--mu:#9aa3af;--bd:#2d343e;--ac:#2dd4bf;--ac2:#06201d;--ok:#4ade80;--er:#f87171;--wa:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.mu{color:var(--mu);font-size:13px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1}.row>button{flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.msg{padding:10px 12px;border-radius:8px;margin-top:10px;font-size:14px;border:1px solid var(--bd)}
.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}
.login{max-width:340px;margin:18vh auto 0;text-align:center}
.login input{text-align:center;font-size:22px;letter-spacing:.3em;margin:0 0 14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar h2{margin:0;margin-right:auto}
textarea{width:100%;height:120px;margin-top:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px monospace}
.hide{display:none!important}
.ph{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:var(--bg)}
.th{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle}
#pa{display:none}
@media print{#p1,#p2{display:none!important}#pa{display:block}body{background:#fff;color:#000}#pa h2{font-size:16px;margin:0 0 4px}#pa table{font-size:11px}#pa .th{width:80px;height:80px;border-radius:4px}#pa th,#pa td{color:#000;border-bottom:1px solid #999;padding:4px 6px}}
</style>
</head>
<body>
<div class="wrap">
<div id="adm" class="card hide"></div>

<!-- PAGE 1: ACCESS CODE -->
<div id="p1" class="login card">
  <h1>🎟️ Gate Ticketing</h1>
  <div class="mu">Enter access code to continue</div>
  <label style="text-align:left">Gate (case-sensitive)</label>
  <input id="gate" placeholder="Gate-1" autocomplete="off" style="text-align:center;font-size:18px;letter-spacing:normal;margin:0">
  <label style="text-align:left">Access code</label>
  <input id="code" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autofocus>
  <button class="p" id="go" style="width:100%">Unlock</button>
  <div id="cerr" class="er" style="margin-top:8px"></div>
  <button id="adminBtn1" type="button" style="margin-top:10px;width:100%">Admin</button>
</div>

<!-- PAGE 2: GATE -->
<div id="p2" class="hide">
  <div class="top"><h1>🎟️ Gate Entry — <span id="gname" style="color:var(--ac)"></span></h1><div style="display:flex;gap:8px"><button id="adminBtn">Admin</button><button id="lock">Lock</button></div></div>

  <div class="card">
    <div class="bar" style="margin:0">
      <h2>Session: <span id="actname" style="color:var(--ac)"></span></h2>
      <input id="newsess" placeholder="New session name (e.g. Evening)" style="flex:1;min-width:160px;width:auto">
      <button id="startsess">Start new session</button>
    </div>
    <div class="mu" id="sessinfo" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <h2>Member lookup</h2>
    <div class="row">
      <input id="mno" placeholder="Member no. (e.g. M1001)" autocomplete="off">
      <button class="p" id="find">Find</button>
    </div>
    <div id="status"></div>
    <div id="form" class="hide">
      <div class="grid">
        <div><label>Member ID</label><input id="f_no" readonly></div>
        <div><label>Name</label><input id="f_name"></div>
        <div><label>Contact</label><input id="f_phone" inputmode="tel"></div>
        <div><label>Photo</label>
          <div style="display:flex;gap:10px;align-items:center">
            <img id="f_img" class="ph hide" alt="">
            <button type="button" id="shot">📷 Take photo</button>
          </div>
          <input id="f_file" type="file" accept="image/*" capture="user" class="hide">
          <div id="phmsg" class="mu"></div>
        </div>
        <div><label>Member QR</label><div id="f_qr" style="background:#fff;display:inline-block;padding:6px;border-radius:8px;min-height:20px"></div></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="save">Save changes</button>
        <button class="p" id="admit">✔ Admit</button>
      </div>
    </div>
    <div class="mu" style="margin-top:10px">Tip: press Enter to search. Edits are saved to the member record.</div>
  </div>

  <div class="card">
    <div class="bar">
      <h2><span id="gtitle"></span> Entered (<span id="cnt">0</span> of <span id="tot">0</span> members)</h2>
      <button id="csv">Export CSV</button>
      <button id="copy">Copy</button>
      <button id="pdf">Export PDF</button>
      <button id="clr">Clear log</button>
    </div>
    <div id="clrbox" class="msg hide" style="margin:0 0 10px">
      <div id="clrtxt"></div>
      <div style="display:flex;gap:8px;margin-top:8px"><button id="clryes" class="p">Yes, clear</button><button id="clrno">Cancel</button></div>
    </div>
    <div class="row" style="margin-bottom:10px"><select id="vsess" style="flex:0 0 40%"></select>
      <input id="q" placeholder="Search entered (member no., name, phone, gate)…"></div>
    <div class="tw"><table>
      <thead><tr><th>#</th><th>Photo</th><th>Member</th><th>Name</th><th>Contact</th><th>Gate</th><th>Session</th></tr></thead>
      <tbody id="log"></tbody>
    </table></div>
    <div id="empty" class="mu" style="padding:10px 0">No entries yet.</div>
    <textarea id="out" class="hide" readonly></textarea>
  </div>
</div>
<div id="pa"></div>
</div>

const ACCESS = "2026";

try { if (window.claude && claude.use) claude.use("downloads").then(d => { dl = d; }).catch(() => {}); } catch(e){}
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
// Demo members — replace or extend; new ones can be added on the spot at the gate
const DEMO = [
  {no:"M1001",name:"Aarav Shah",phone:"9800000001",photo:""},
  {no:"M1002",name:"Priya Patel",phone:"9800000002",photo:""},
  {no:"M1003",name:"Rohan Mehta",phone:"9800000003",photo:""},
  {no:"M1004",name:"Neha Desai",phone:"9800000004",photo:""},
  {no:"M1005",name:"Kunal Joshi",phone:"9800000005",photo:""}
];
let members = store.get("gt_members", null) || DEMO;
let entries = store.get("gt_entries", []);
let sessions = store.get("gt_sessions", null);
if (!sessions || !sessions.length){ sessions = [{id:"s1", name:"Session 1", start:new Date().toLocaleString()}]; store.set("gt_sessions", sessions); }
entries.forEach(e => { if (!e.sess) e.sess = sessions[0].id; });  // older entries -> first session
const act = () => sessions[sessions.length-1];            // active session = latest
const sname = id => (sessions.find(x => x.id === id) || {name:"?"}).name;
let viewSess = act().id;                                  // "ALL" or a session id
let current = null, isNew = false, gate = "", reAdmit = null;

const vCode = v => !v ? "Access code is required" : /^\d+$/.test(v) ? "" : "Access code must be digits only";
const vNo   = v => !v ? "Member ID is required" : RE_NO.test(v) ? "" : "Member ID: 2–15 letters, numbers or -";
const vName = v => !v ? "Name is required" : RE_NAME.test(v) ? "" : "Name: 2–60 letters (spaces . ' - allowed), no digits";
const vPhone= v => !v ? "Contact is required" : RE_PH.test(v.replace(/[\s-]/g,"")) ? "" : "Contact: 7–15 digits, optional leading +";
const vSess = v => RE_SESS.test(v) ? "" : "Session name: max 30 chars, letters/numbers/space/-/_ only";
function fieldErr(id, msg){
  const el = $(id); let d = $("e_"+id);
  if (!d){ d = document.createElement("div"); d.id = "e_"+id; d.className = "er"; d.style.fontSize = "12px"; el.parentNode.insertBefore(d, el.nextSibling); }
  d.textContent = msg || ""; el.style.borderColor = msg ? "var(--er)" : ""; return !msg;
}
$("gate").maxLength=20; $("f_name").maxLength=60; $("f_phone").maxLength=16; $("mno").maxLength=40; $("newsess").maxLength=30; $("q").maxLength=50;
$("code").oninput = () => { $("code").value = $("code").value.replace(/\D/g,""); };
$("f_phone").oninput = () => { $("f_phone").value = $("f_phone").value.replace(/[^\d+\s-]/g,""); fieldErr("f_phone",""); };
$("f_name").oninput = () => fieldErr("f_name","");
$("gate").addEventListener("input", () => fieldErr("gate",""));
$("code").addEventListener("input", () => fieldErr("code",""));

// Page 1
function unlock(){
  const g = $("gate").value.trim(), c = $("code").value.trim();
  const ge = vGate(g), ce = vCode(c);
  fieldErr("gate", ge); fieldErr("code", ce);
  if (ge || ce){ $("cerr").textContent = ""; return; }
  if (c === ACCESS){
    gate = g; $("gname").textContent = g; $("gtitle").textContent = "All gates —"; $("q").value = "";
    $("p1").classList.add("hide"); $("p2").classList.remove("hide"); $("cerr").textContent="";
    render(); $("mno").focus();
  } else { $("cerr").textContent = "Wrong code"; $("code").value = ""; }
}
$("go").onclick = unlock;
$("gate").onkeydown = e => { if (e.key === "Enter") $("code").focus(); };
$("code").onkeydown = e => { if (e.key === "Enter") unlock(); };
$("lock").onclick = () => { admOk = false; $("adm").classList.add("hide"); $("p2").classList.add("hide"); $("p1").classList.remove("hide"); $("code").value=""; resetForm(); };

// Page 2
function resetForm(){ reAdmit = null; current=null; isNew=false; $("form").classList.add("hide"); status(""); }
let curPhoto = "";
function setPhoto(d){
  curPhoto = d || "";
  $("f_img").src = curPhoto; $("f_img").classList.toggle("hide", !curPhoto);
  $("shot").textContent = curPhoto ? "📷 Retake photo" : "📷 Take photo";
  $("phmsg").textContent = curPhoto ? "" : "No photo yet (optional) — you can take one";
}
function showQr(no){
  const el = $("f_qr"); el.innerHTML = "";
  try { new QRCode(el, {text: "GATEPASS|" + no, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M}); } catch(e){ el.textContent = "QR unavailable"; }
}
function fill(m){
  showQr(m.no);
  fieldErr("f_name",""); fieldErr("f_phone","");
  $("f_no").value=m.no; $("f_name").value=m.name||""; $("f_phone").value=m.phone||"";
  setPhoto(m.photo);
  $("form").classList.remove("hide");
}
$("shot").onclick = () => $("f_file").click();
$("f_file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)){ $("phmsg").textContent = "Please choose an image file"; e.target.value = ""; return; }
  if (f.size > 10*1024*1024){ $("phmsg").textContent = "Image too large (max 10 MB)"; e.target.value = ""; return; }
  const img = new Image();
  img.onload = () => {
    const S = 400, side = Math.min(img.width, img.height);   // centre square crop, higher quality
    const c = document.createElement("canvas"); c.width = c.height = S;
    c.getContext("2d").drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
    setPhoto(c.toDataURL("image/jpeg",.85)); URL.revokeObjectURL(img.src);
  };
  img.onerror = () => { $("phmsg").textContent = "Could not read this image"; };
  img.src = URL.createObjectURL(f); e.target.value = "";
};
function find(){
  let no = $("mno").value.trim();
  if (/^GATEPASS\|/i.test(no)) { const pt = no.split("|"); no = pt[2] || pt[1] || ""; }   // scanned QR: GATEPASS|<id>|<member>
  no = no.toUpperCase();
  if (!no){ resetForm(); status("Enter a member ID", "wa"); return; }
  const ne = vNo(no); if (ne){ resetForm(); status(ne, "er"); return; }
  const m = members.find(x => x.no.toUpperCase() === no);
  if (m){
    current = {...m}; isNew = false; fill(current);
    const prev = entries.find(e => e.no === m.no && e.sess === act().id);
    status((prev ? `⚠ Already entered this session at ${esc(prev.gate)} (${esc(prev.time)}). ` : "Member found. ") + (m.editGate ? `Last edited at ${esc(m.editGate)}.` : ""), prev ? "wa" : "ok");
  } else {
    current = {no, name:"", phone:"", photo:""}; isNew = true; fill(current);
    status("Member not found — fill details to add as a new member", "er");
  }
}
function readForm(){
  return {no:$("f_no").value, name:$("f_name").value.trim(), phone:$("f_phone").value.trim(), photo:curPhoto};
}
function saveMember(){
  const m = readForm();
  m.phone = m.phone.replace(/[\s-]/g,"");
  const en = vName(m.name), ep = vPhone(m.phone), ei = vNo(m.no);
  fieldErr("f_name", en); fieldErr("f_phone", ep);
  if (ei){ status(ei, "er"); return null; }
  if (en || ep){ status("Please fix the highlighted fields", "er"); return null; }
  const i = members.findIndex(x => x.no === m.no);
  const old = i >= 0 ? members[i] : null;
  const changed = !old || ["name","phone","photo"].some(k => old[k] !== m[k]);
  m.editGate = changed ? gate : (old.editGate || "");
  m.editTime = changed ? new Date().toLocaleString() : (old.editTime || "");
  if (i >= 0) members[i] = m; else members.push(m);
  store.set("gt_members", members); isNew = false; current = m; render();
  return m;
}
$("find").onclick = find;
$("mno").onkeydown = e => { if (e.key === "Enter") find(); };
$("save").onclick = () => { if (saveMember()) status("Details saved", "ok"); };
$("admit").onclick = () => {
  const m = saveMember(); if (!m) return;
  if (entries.some(e => e.no === m.no && e.sess === act().id) && reAdmit !== m.no){
    reAdmit = m.no; status("⚠ Already entered this session. Press Admit again to record a re-entry.", "wa"); return;
  }
  reAdmit = null;
  entries.unshift({no:m.no, name:m.name, phone:m.phone, gate, sess:act().id, time: new Date().toLocaleString()});
  store.set("gt_entries", entries); viewSess = act().id; render();
  $("mno").value=""; resetForm(); status(`✔ ${esc(m.name)} admitted` + (entries.filter(e=>e.no===m.no && e.sess===act().id).length>1 ? " (re-entry recorded)" : ""), "ok"); $("mno").focus();
};

function phOf(no){ const m = members.find(x=>x.no===no); return m && m.photo ? `<img class="th" src="${m.photo}" alt="">` : "—"; }
function match(e){
  const q = $("q").value.trim().toLowerCase();
  return !q || [e.no,e.name,e.phone,e.gate,e.time].some(v => String(v||"").toLowerCase().includes(q));
}
const scoped = () => entries.filter(e => viewSess === "ALL" || e.sess === viewSess);
const key = e => e.sess + "|" + e.no;
// Entered list: each member once per session, with first entry time (re-entries recorded, not shown)
function view(){
  const sc = scoped(), seen = new Set(), first = new Set();
  for (let i = sc.length-1; i >= 0; i--){ if (!seen.has(key(sc[i]))){ seen.add(key(sc[i])); first.add(sc[i]); } }
  return sc.filter(e => first.has(e) && match(e));
}
// Export: every entry in scope, re-entries included, with times
function viewAll(){
  const sc = scoped(), seen = new Set(), re = new Map();
  for (let i = sc.length-1; i >= 0; i--){ re.set(sc[i], seen.has(key(sc[i]))); seen.add(key(sc[i])); }
  return sc.filter(match).map(e => ({...e, re: re.get(e)}));
}
function sessUI(){
  $("actname").textContent = act().name;
  $("sessinfo").textContent = "Started " + act().start + ". New entries go to this session.";
  $("vsess").innerHTML = '<option value="ALL">All sessions</option>' + sessions.slice().reverse().map(x => `<option value="${esc(x.id)}">${esc(x.name)}${x.id===act().id?" (active)":""}</option>`).join("");
  $("vsess").value = viewSess;
}
function render(){
  const sc = scoped(), list = view(), total = sc.length;
  $("log").innerHTML = list.map((e,i) => `<tr><td>${list.length-i}</td><td>${phOf(e.no)}</td><td>${esc(e.no)}</td><td>${esc(e.name)}</td><td>${esc(e.phone)}</td><td>${esc(e.gate)}</td><td>${esc(sname(e.sess))}</td></tr>`).join("");
  $("empty").textContent = total ? "No matches." : "No entries yet.";
  $("empty").classList.toggle("hide", list.length>0);
  $("cnt").textContent = new Set(sc.map(e=>e.no)).size;
  $("tot").textContent = members.length;
  sessUI();
}
function csv(){
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rows = [["Session","Gate","Member No","Name","Contact","Entry Time","Entry Type","Details Last Edited At"]]
    .concat(viewAll().slice().reverse().map(e => [sname(e.sess),e.gate,e.no,e.name,e.phone,e.time,e.re?"Re-entry":"First entry",(members.find(m=>m.no===e.no)||{}).editGate||""]));
  return rows.map(r => r.map(q).join(",")).join("\n");
}
function showOut(t){ const o=$("out"); o.value=t; o.classList.remove("hide"); o.select(); }
const stamp = () => new Date().toISOString().slice(0,10);
async function saveFile(filename, data){
  if (!dl) return false;
  try { await dl.save({filename, data}); status("✔ " + esc(filename) + " saved", "ok"); }
  catch(e){ status(e && e.code === "declined" ? "Save cancelled" : "Could not save file (" + ((e && e.code) || "error") + ")", e && e.code === "declined" ? "wa" : "er"); }
  return true;
}
$("csv").onclick = async () => {
  if (!viewAll().length){ status("Nothing to export", "wa"); return; }
  const t = csv();
  if (await saveFile("gate-entries-" + stamp() + ".csv", "\ufeff" + t)) return;
  showOut(t); status("Download not available here — copy the CSV from the box below", "wa");
};
$("copy").onclick = async () => {
  if (!viewAll().length){ status("Nothing to copy", "wa"); return; }
  const t = csv(); showOut(t);
  try { await navigator.clipboard.writeText(t); status("CSV copied", "ok"); } catch(e){ document.execCommand && document.execCommand("copy"); }
};
const clrScope = () => viewSess==="ALL" ? "ALL sessions" : sname(viewSess);
$("clr").onclick = () => {
  if (!scoped().length){ status("Nothing to clear", "wa"); return; }
  $("clrtxt").textContent = "Clear all " + scoped().length + " entry records for " + clrScope() + " (every gate)? This cannot be undone.";
  $("clrbox").classList.remove("hide");
};
$("clrno").onclick = () => $("clrbox").classList.add("hide");
$("clryes").onclick = () => {
  entries = viewSess==="ALL" ? [] : entries.filter(e => e.sess !== viewSess);
  store.set("gt_entries", entries);
  $("clrbox").classList.add("hide"); $("out").classList.add("hide");
  render(); status("Log cleared for " + esc(clrScope()), "ok");
};
$("pdf").onclick = async () => {
  const list = viewAll().slice().reverse();
  if (!list.length){ status("Nothing to export", "wa"); return; }
  const scope = viewSess==="ALL" ? "All sessions" : sname(viewSess);
  const J = window.jspdf && window.jspdf.jsPDF;
  if (dl && J){
    try {
      const doc = new J({orientation:"landscape", unit:"mm", format:"a4"});
      doc.setFontSize(14); doc.text("Gate Entry Report", 14, 14);
      doc.setFontSize(9); doc.text(`Gate: ${gate}   Session: ${scope}   Generated: ${new Date().toLocaleString()}   Records: ${list.length}`, 14, 20);
      const hasPh = no => { const m = members.find(x => x.no === no); return m && m.photo ? m.photo : ""; };
      doc.autoTable({
        startY: 25, margin: {left: 14, right: 14, bottom: 14}, theme: "grid",
        head: [["#","Photo","Session","Gate","Member ID","Name","Contact","Entry Time","Type"]],
        body: list.map((e,i) => [i+1, hasPh(e.no) ? "" : "-", sname(e.sess), e.gate, e.no, e.name, e.phone, e.time, e.re ? "Re-entry" : "First entry"]),
        styles: {fontSize:8, cellPadding:1.5, minCellHeight:26, valign:"middle", lineColor:[210,214,220], lineWidth:0.2, overflow:"linebreak"},
        headStyles: {fillColor:[15,118,110], textColor:255, fontSize:8, halign:"left", minCellHeight:8},
        alternateRowStyles: {fillColor:[246,248,250]},
        columnStyles: {
          0:{cellWidth:8, halign:"center"}, 1:{cellWidth:26, halign:"center"}, 2:{cellWidth:28}, 3:{cellWidth:20},
          4:{cellWidth:24}, 5:{cellWidth:56}, 6:{cellWidth:30}, 7:{cellWidth:40, fontSize:6.5, textColor:[107,114,128]}, 8:{cellWidth:24}
        },
        didDrawCell: d => {
          if (d.section !== "body" || d.column.index !== 1) return;
          const img = hasPh(list[d.row.index].no); if (!img) return;
          try {
            const pr = doc.getImageProperties(img), box = 22, k = Math.min(box/pr.width, box/pr.height);
            const w = pr.width*k, h = pr.height*k;
            doc.addImage(img, "JPEG", d.cell.x + (d.cell.width-w)/2, d.cell.y + (d.cell.height-h)/2, w, h);
          } catch(e){}
        }
      });
      const pages = doc.getNumberOfPages();
      for (let i = 1; i <= pages; i++){ doc.setPage(i); doc.setFontSize(7); doc.setTextColor(120); doc.text(`Page ${i} of ${pages}`, 283, 203, {align:"right"}); }
      await saveFile("gate-report-" + stamp() + ".pdf", doc.output("arraybuffer"));
    } catch(e){ status("Could not build PDF", "er"); }
    return;
  }
  // Fallback: browser print dialog -> Save as PDF
  $("pa").innerHTML = `<h2>Gate Entry Report</h2><div style="font-size:12px;margin-bottom:8px">Gate: ${esc(gate)} · Session: ${esc(scope)} · Generated: ${esc(new Date().toLocaleString())} · Records: ${list.length}</div>
  <table><thead><tr><th>#</th><th>Photo</th><th>Session</th><th>Gate</th><th>Member ID</th><th>Name</th><th>Contact</th><th>Entry Time</th><th>Type</th></tr></thead><tbody>`
  + list.map((e,i) => `<tr><td>${i+1}</td><td>${phOf(e.no)}</td><td>${esc(sname(e.sess))}</td><td>${esc(e.gate)}</td><td>${esc(e.no)}</td><td>${esc(e.name)}</td><td>${esc(e.phone)}</td><td>${esc(e.time)}</td><td>${e.re?"Re-entry":"First entry"}</td></tr>`).join("")
  + "</tbody></table>";
  try { window.print(); } catch(err){ status("PDF not available here — use Export CSV", "er"); }
};

// ---------- Admin (sessions / gates / members overview, single fixed password) ----------
const ADMIN_HASH = "76fa7ca78cb87f8b96908083a7bbe25d17a06803270dce141789a3308e336b34"; let admOk = false;   // SHA-256 of the admin password
async function sha256(t){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(d), x => x.toString(16).padStart(2,"0")).join("");
}
function admDraw(){
  const A = $("adm");
  if (!admOk){
    A.innerHTML = `<h2>Admin sign in</h2>
      <div class="row"><input id="ap" type="password" placeholder="Admin password" maxlength="64" autocomplete="off"><button class="p" id="apgo">Enter</button><button id="admx" type="button">Close</button></div>
      <div id="apm" class="er" style="margin-top:6px"></div>`;
    const go = async () => {
      const m = $("apm"); m.textContent = "";
      try {
        if (await sha256($("ap").value) !== ADMIN_HASH){ m.textContent = "Incorrect password"; $("ap").value = ""; return; }
        admOk = true; admDraw();
      } catch(e){ m.textContent = "Could not verify (needs HTTPS)"; }
    };
    $("apgo").onclick = go; $("ap").onkeydown = e => { if (e.key === "Enter") go(); };
    $("admx").onclick = closeAdmin;
    $("ap").focus();
    return;
  }
  A.innerHTML = `<div class="bar"><h2>Admin — all data</h2><button id="admref">Refresh</button><button id="admx" type="button">← Back</button></div>
    <div class="mu" id="admstats" style="margin-bottom:10px"></div>
    <div class="row" style="margin-bottom:8px">
      <select id="admsess"></select>
      <select id="admflt"><option value="all">All members</option><option value="in">Entered</option><option value="out">Not entered</option></select>
    </div>
    <div class="row" style="margin-bottom:10px"><input id="admq" placeholder="Search member no., name, contact, gate…" maxlength="50"><button id="admcsv" type="button">Export CSV</button></div>
    <div class="tw"><table><thead><tr><th>Photo</th><th>Member ID</th><th>Name</th><th>Contact</th><th>Status</th><th>First entry</th><th>Gate</th><th>Entries</th><th>Last edited at</th></tr></thead><tbody id="admrows"></tbody></table></div>
    <div id="admempty" class="mu" style="padding:10px 0"></div>
    <textarea id="admout" class="hide" readonly></textarea>
    <h2 style="margin-top:18px">Sessions</h2>
    <div class="tw"><table><thead><tr><th>Session</th><th>Started</th><th>Entries</th><th>Members</th><th>Gates (entries)</th></tr></thead><tbody id="admsessrows"></tbody></table></div>`;
  $("admsess").innerHTML = '<option value="ALL">Entered in: any session</option>' + sessions.slice().reverse().map(x => `<option value="${esc(x.id)}">Entered in: ${esc(x.name)}</option>`).join("");
  $("admsess").value = admSess; $("admflt").value = admFlt; $("admq").value = admQ;
  $("admref").onclick = admDraw; $("admx").onclick = closeAdmin;
  $("admsess").onchange = () => { admSess = $("admsess").value; admTable(); };
  $("admflt").onchange = () => { admFlt = $("admflt").value; admTable(); };
  $("admq").oninput = () => { admQ = $("admq").value; admTable(); };
  $("admcsv").onclick = async () => {
    const list = admList(); if (!list.length){ return; }
    const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
    const rows = [["Member No","Name","Contact","Status","Session","First Entry Time","Gate","Entry Count","Last Edited Gate","Last Edited Time"]]
      .concat(list.map(r => [r.m.no, r.m.name, r.m.phone, r.entered ? "Entered" : "Not entered", admSess === "ALL" ? "Any" : sname(admSess), r.first ? r.first.time : "", r.first ? r.first.gate : "", r.es.length, r.m.editGate || "", r.m.editTime || ""]));
    const t = rows.map(r => r.map(q).join(",")).join("\n");
    if (await saveFile("members-" + stamp() + ".csv", "\ufeff" + t)) return;
    const o = $("admout"); o.value = t; o.classList.remove("hide"); o.select();
  };
  const sr = sessions.slice().reverse().map(x => {
    const es = entries.filter(e => e.sess === x.id), g = {};
    es.forEach(e => g[e.gate] = (g[e.gate]||0) + 1);
    return `<tr><td>${esc(x.name)}</td><td>${esc(x.start)}</td><td>${es.length}</td><td>${new Set(es.map(e=>e.no)).size}</td><td>${Object.entries(g).map(([k,v]) => esc(k)+" ("+v+")").join(", ") || "—"}</td></tr>`;
  }).join("");
  $("admsessrows").innerHTML = sr;
  admTable();
}
let admSess = "ALL", admFlt = "all", admQ = "", admPrev = "p1";
// All members (entered or not) with their status in the chosen session scope
function admList(){
  const q = admQ.trim().toLowerCase();
  return members.map(m => {
    const es = entries.filter(e => e.no === m.no && (admSess === "ALL" || e.sess === admSess));
    return {m, es, entered: es.length > 0, first: es[es.length-1]};
  }).filter(r => (admFlt === "all" || (admFlt === "in") === r.entered)
    && (!q || [r.m.no, r.m.name, r.m.phone, r.first && r.first.gate, r.m.editGate].some(v => String(v||"").toLowerCase().includes(q))));
}
function admTable(){
  const all = members.length, inn = members.filter(m => entries.some(e => e.no === m.no && (admSess === "ALL" || e.sess === admSess))).length;
  $("admstats").innerHTML = `Members: <b>${all}</b> · Entered: <b>${inn}</b> · Not entered: <b>${all-inn}</b> · Sessions: <b>${sessions.length}</b> · Total entries: <b>${entries.length}</b> · Gates used: <b>${new Set(entries.map(e=>e.gate)).size}</b>`;
  const list = admList();
  $("admrows").innerHTML = list.map(r => `<tr><td>${phOf(r.m.no)}</td><td>${esc(r.m.no)}</td><td>${esc(r.m.name)}</td><td>${esc(r.m.phone)}</td><td class="${r.entered ? "ok" : "wa"}">${r.entered ? "Entered" : "Not entered"}</td><td>${r.first ? esc(r.first.time) : "—"}</td><td>${r.first ? esc(r.first.gate) : "—"}</td><td>${r.es.length}</td><td>${esc(r.m.editGate || "—")}</td></tr>`).join("");
  $("admempty").textContent = list.length ? "" : "No members match.";
}
function openAdmin(){
  admPrev = $("p2").classList.contains("hide") ? "p1" : "p2";
  $("p1").classList.add("hide"); $("p2").classList.add("hide"); $("adm").classList.remove("hide"); admDraw();
}
function closeAdmin(){ $("adm").classList.add("hide"); $(admPrev).classList.remove("hide"); }
$("adminBtn").onclick = $("adminBtn1").onclick = openAdmin;

$("q").oninput = render;
$("vsess").onchange = () => { viewSess = $("vsess").value; $("out").classList.add("hide"); render(); };
$("startsess").onclick = () => {
  const raw = $("newsess").value.trim(), se = raw ? vSess(raw) : "";
  if (se){ status(se, "er"); return; }
  const name = raw || ("Session " + (sessions.length+1));
  if (sessions.some(x => x.name === name)){ status("Session name already used", "er"); return; }
  sessions.push({id:"s"+Date.now(), name, start:new Date().toLocaleString()});
  store.set("gt_sessions", sessions); viewSess = act().id; $("newsess").value = ""; $("out").classList.add("hide");
  resetForm(); render(); status("New session started: " + esc(name), "ok");
};
</script>
